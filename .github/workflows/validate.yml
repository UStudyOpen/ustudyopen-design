name: Validate design
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate-design:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14.8'
      - name: Install pinned legal validator
        run: python3 -m pip install -r tooling/requirements-licensing.txt
      - name: Validate licensing, SPDX and incremental REUSE scope
        run: python3 tooling/licensing.py --reuse
      - name: Test shared tooling and publication authorization
        run: python3 tests/test_pages_automation.py
      - name: Validate repository hygiene and source
        run: python3 tests/check_repository.py
      - name: Install verified Quarto 1.10.18
        run: python3 tooling/install_quarto.py
      - name: Verify two independent reproducible builds
        run: python3 tests/clean_render.py
      - name: Validate HTML, resources, themes and routes
        run: python3 tests/check_site.py
      - name: Retain validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: design-validation-evidence
          path: |
            artifacts/stabilization/
            artifacts/v0.2/hygiene-results.json
            artifacts/v0.2/static-results.json
          if-no-files-found: warn
          retention-days: 7
